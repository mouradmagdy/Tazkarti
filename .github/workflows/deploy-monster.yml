name: Deploy API to MonsterASP.NET

on:
  workflow_dispatch:
  push:
    branches: [deployment-monster-vercel]
    paths:
      - "Tazkarti/**"
      - ".github/workflows/deploy-monster.yml"

permissions:
  contents: read

concurrency:
  group: monster-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tazkarti/Tazkarti.csproj

      - name: Build
        run: dotnet build Tazkarti/Tazkarti.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Tazkarti/Tazkarti.csproj --configuration Release --no-build --output publish

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.MONSTER_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.MONSTER_SERVER_URL }}
          server-username: ${{ secrets.MONSTER_USERNAME }}
          server-password: ${{ secrets.MONSTER_PASSWORD }}
